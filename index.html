<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%23f4f4f5' stroke-width='4'/><line x1='12' y1='50' x2='88' y2='50' stroke='%236366f1' stroke-width='4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Anti-FOUC Theme Script (Executes before first render) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('horizon-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored ? stored : (systemDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>HORIZON — Beyond what we know</title>
    <meta name="title" content="HORIZON — Beyond what we know" />
    <meta name="description" content="A personal digital space by Sam exploring products, software, architectures and frontier questions at the boundary of what we know." />
    <meta name="author" content="Sam" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
